[pytest]
# menu_system_test.py at the repo root is a manual smoke-test script (loops
# over live restaurant URLs, no assertions) meant to be run directly with
# `python menu_system_test.py`, not collected by pytest. It also references
# normalization/canonical modules that were never built. Scope discovery to
# the real test suite so it doesn't get swept up by pytest's default
# `*_test.py` naming match.
testpaths = tests

# Every tests/<subdir>/ has an __init__.py but tests/ itself doesn't, so
# pytest's default "prepend" import mode inserts backend/tests (not backend/)
# onto sys.path for these modules — `import app` then fails with
# "No module named 'app'" depending on collection order. Explicitly put
# backend/ (this file's directory) on sys.path so `app.*` always resolves.
pythonpath = .
