name: GitHub AI comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-comment-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      vars.AI_COMMENTS_ENABLED == 'true' &&
      (github.event.repository.private == false || vars.PRIVATE_CODE_AI_ENABLED == 'true') &&
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/ask') ||
       startsWith(github.event.comment.body, '/review') ||
       startsWith(github.event.comment.body, '/summarize') ||
       startsWith(github.event.comment.body, '/help'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use only trusted bot code from the default branch. PR code is never run.
      - name: Check out trusted bot code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify assistant
        run: npm test && npm run build

      - name: Respond to command
        run: npm run ai-comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
