name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-no-conflict-markers:
    name: Guard (no unresolved merge conflict markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for unresolved conflict markers
        run: |
          if grep -rlE '^(<<<<<<<|=======|>>>>>>>)( |$)' \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=.venv \
              --exclude-dir=__pycache__ \
              .; then
            echo "::error::Unresolved merge conflict markers found in the files listed above."
            exit 1
          fi

  backend:
    name: Backend (syntax + import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Root requirements.txt matches backend's (Railway's real build entry point)
        working-directory: ${{ github.workspace }}
        run: |
          python3 -c "
          def package_lines(path):
              with open(path) as f:
                  return sorted(
                      line.strip() for line in f
                      if line.strip() and not line.strip().startswith('#')
                  )
          root = package_lines('requirements.txt')
          backend = package_lines('backend/requirements.txt')
          assert root == backend, (
              f'requirements.txt (root) and backend/requirements.txt have '
              f'drifted apart.\nOnly in root: {sorted(set(root) - set(backend))}\n'
              f'Only in backend: {sorted(set(backend) - set(root))}'
          )
          "
          pip install --dry-run -r requirements.txt
          pip install --dry-run -r backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Syntax check (compile every .py file)
        run: python -m compileall -q app
      - name: Import sanity check
        env:
          APP_ENV: dev
        run: python -c "import app.main; print('import OK')"
      - name: Run tests
        env:
          APP_ENV: dev
          DATABASE_URL: "sqlite:///./test_crave.db"
        run: pytest -q
      - name: Migration chain has exactly one head
        env:
          APP_ENV: dev
          DATABASE_URL: "sqlite:///./test_crave.db"
        run: |
          heads=$(python -m alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 alembic head, found $heads. Add a merge migration."
            python -m alembic heads
            exit 1
          fi
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: pipx run pip-audit -r requirements.txt

  backend-postgres:
    name: Backend (same suite, against real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run full migration chain against real Postgres, from empty
        env:
          APP_ENV: dev
          DATABASE_URL: "postgresql://postgres@localhost:5432/postgres"
        run: alembic upgrade head
      - name: Newest migration downgrades and re-upgrades cleanly
        env:
          APP_ENV: dev
          DATABASE_URL: "postgresql://postgres@localhost:5432/postgres"
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Run tests against real Postgres
        env:
          APP_ENV: dev
          DATABASE_URL: "postgresql://postgres@localhost:5432/postgres"
        run: pytest -q

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        shell: bash
        run: |
          set +e
          npx jest --ci 2>&1 | tee jest-output.txt
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload temporary Jest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-jest-diagnostics
          path: frontend/jest-output.txt
          if-no-files-found: error
