name: CI

# Smoke-test + real-test gate for both halves of the app.
#
# CORRECTION (this comment previously claimed "there are currently no
# automated tests in either backend/ or frontend/" — that was wrong for the
# backend. backend/tests/ has 20 real pytest files; they were just never
# discovered during the audit that produced this file, and were never wired
# into CI. Frontend genuinely has zero test files as of this writing.
#
# Backend: syntax/import checks run first (cheap, catch the broadest class
# of breakage — a bad edit, a missing symbol, a circular import), then the
# real test suite via pytest. See tests/conftest.py for why DATABASE_URL is
# set explicitly here: nothing in the app calls Base.metadata.create_all(),
# so a bare fresh SQLite file has no tables, and every DB-touching test
# would otherwise fail immediately with "no such table".
#
# Frontend: TypeScript typecheck only — no test files exist yet.
#
# NOTE: this is the first time backend/tests/ has ever been run against the
# current codebase (no shell access existed anywhere in this project until
# now) — expect some of the 20 files to surface real, previously-invisible
# failures on the first CI run. That's the point of turning this on, not a
# sign it's broken.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (syntax + import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt plus pytest (and
        # playwright/pdfminer, used by some extraction tests).
        run: pip install -r requirements-dev.txt

      - name: Syntax check (compile every .py file)
        run: python -m compileall -q app

      - name: Dependency vulnerability scan
        # Advisory only (continue-on-error) — this is the first time this
        # has run, so an unpinned/vulnerable transitive dep here is a known
        # gap being surfaced for the first time, not a new regression. Flip
        # to blocking once the initial findings are triaged.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Import sanity check
        # No DATABASE_URL is set here, so this exercises the sqlite fallback
        # path (see app/config/settings.py Settings.resolved_database_url) —
        # this is intentionally NOT a full app boot, just confirms the
        # import graph resolves (catches circular imports / missing symbols
        # / typos in module paths introduced by an edit).
        env:
          APP_ENV: dev
        run: python -c "import app.main; print('import OK')"

      - name: Run tests
        env:
          APP_ENV: dev
          DATABASE_URL: "sqlite:///./test_crave.db"
        run: pytest -q

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # NOTE: this requires package-lock.json to be in sync with
        # package.json. A recent fix bumped several expo-* versions in
        # package.json (see git history / the remediation log) but
        # package-lock.json was NOT regenerated — no npm access was
        # available to run it. `npm ci` will fail until someone runs
        # `npm install` locally and commits the updated lockfile.
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
